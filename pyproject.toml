[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autograd"
version = "1.9.1"
requires-python = ">=3.11"
description = "Efficiently computes derivatives of NumPy code."
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
authors = [
  {name = "Dougal Maclaurin", email = "maclaurin@physics.harvard.edu"},
  {name = "David Duvenaud", email = "duvenaud@cs.toronto.edu"},
  {name = "Matthew Johnson", email = "mattjj@csail.mit.edu"},
  {name = "Jamie Townsend", email = "j.h.n.townsend@uva.nl"},
]
maintainers = [
  {name = "Jamie Townsend", email = "j.h.n.townsend@uva.nl"},
  {name = "Fabian Joswig", email = "fabian.joswig@uni-muenster.de"},
  {name = "Agriya Khetarpal", email = "agriyakhetarpal@outlook.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
]
keywords = [
  "Automatic differentiation",
  "backpropagation",
  "gradients",
  "machine learning",
  "optimization",
  "neural networks",
  "Python",
  "NumPy",
  "SciPy",
]
dependencies = [
  "numpy>=2.0,<3",
]
# dynamic = ["version"]

[project.urls]
Source = "https://github.com/HIPS/autograd"

[project.optional-dependencies]
scipy = [
  "scipy>=1.13",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "xarray",
]
examples = ["matplotlib"]
typecheck = [
  "pyrefly==1.5.0",
  # pyrefly cannot resolve `from numpy import *` with older NumPy stubs
  "numpy>=2.2",
  "scipy-stubs",
]

[tool.uv]
exclude-newer = "3 days ago"

[tool.pyrefly]
project-includes = ["autograd"]
preset = "strict"

[tool.pyrefly.errors]
# These need annotations on every parameter and lambda
implicit-any-parameter = "ignore"
implicit-any-lambda = "ignore"
# typing.override needs Python 3.12
missing-override-decorator = "ignore"

# Boxes and traced values are passed to functions that are typed with
# NumPy's and SciPy's own signatures
[[tool.pyrefly.sub-config]]
matches = "autograd/numpy/*.py"
errors = { no-matching-overload = "ignore", bad-argument-type = "ignore" }

[[tool.pyrefly.sub-config]]
matches = "autograd/scipy/**/*.py"
errors = { no-matching-overload = "ignore", bad-argument-type = "ignore", deprecated = "ignore" }

[tool.coverage.run]
source = ["autograd"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
required_plugins = ["pytest-cov", "pytest-xdist"]
# TODO: generate HTML report, upload to CodeCov
addopts = "--color=yes -sra -n auto --cov=autograd --cov-report=xml --cov-report=term"

[tool.ruff]
extend-exclude = []
# TODO: not ignore them
lint.extend-ignore = [
  "E731",
  "F401",
  "F403",
  "F841",
  "F821",
  "E721",
  "E722",
  "E741",
  "E402",
  "F811"
]
lint.extend-select = ["I", "W"]
line-length = 109
